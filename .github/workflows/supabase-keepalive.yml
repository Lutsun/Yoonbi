# Garde le projet Supabase actif.
#
# Sur l'offre gratuite, Supabase met en pause un projet sans activité pendant
# une semaine : l'app et la console d'administration ne peuvent alors plus se
# connecter. Une requête légère tous les 3 jours suffit à l'éviter.
#
# Secrets du dépôt utilisés : SUPABASE_URL et SUPABASE_ANON_KEY (la clé
# publique, la même que celle de l'app — aucune clé d'administration).

name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/operators?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Réponse Supabase : $status"
          test "$status" = "200"
